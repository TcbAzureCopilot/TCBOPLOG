name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Tests use H2 in DB2-compat mode; no external DB needed.
      # Surefire passes -Dmachineroom.config=config/app.dev.properties automatically (see pom.xml).
      - name: Run tests
        run: mvn -B test
