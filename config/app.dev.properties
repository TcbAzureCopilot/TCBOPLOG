# 本機開發設定（mvn jetty:run 使用；H2 in DB2 mode）
app.title=機房操作日誌系統
app.org=合作金庫資訊部
app.logicalDayCutoffHour=7
app.pollSeconds=5

auth.mode=dev
dev.users=op001:op001:OPERATOR:王小明,op002:op002:OPERATOR:李大華,op003:op003:OPERATOR:張三,dep001:dep001:DEPUTY:陳副科,chief001:chief001:CHIEF:林科長,super:super:OPERATOR|DEPUTY|CHIEF:多角色測試

roles.operatorGroups=CN=MachineRoom-Operators,OU=Groups,DC=bank,DC=local
roles.deputyAccounts=dep001
roles.chiefAccounts=chief001
roles.adminAccounts=
roles.adminGroups=

security.allowedClientIps=
security.trustProxyHeader=false

db.jndiName=jdbc/MachineRoomDS
db.autoInit=true
db.seedDefaultsIfEmpty=true

# Prefer TrueType (.ttf/.ttc); CFF-based .otf (e.g. Noto Sans CJK .otf) can produce broken glyphs with OpenPDF subsetting
pdf.fontPaths=/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc,0;/usr/share/fonts/truetype/wqy/wqy-microhei.ttc,0
pdf.fontName=WenQuanYi Zen Hei
