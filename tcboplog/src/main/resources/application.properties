# TCBOPLOG — Spring Boot settings (application settings live in the external app.properties, see MACHINEROOM_CONFIG)
spring.application.name=TCBOPLOG
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=600m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=TCBOPLOGSESSION
# serve /static/** and /index.jsp from the WAR root as well as the classpath
spring.web.resources.static-locations=/,classpath:/static/
spring.mvc.static-path-pattern=/**
# no Spring MVC error page decoration needed
server.error.whitelabel.enabled=true
logging.level.root=INFO
