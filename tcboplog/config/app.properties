# =====================================================================
#  TCBOPLOG 試用版 外部設定檔（Docker image 內建於 /app/config/app.properties）
#  要覆寫：docker run -v /your/app.properties:/app/config/app.properties ...
#  格式與 WebSphere 版完全相同（見 config/app.properties.sample），本檔只列試用版常用項。
# =====================================================================

app.title=TCBOPLOG 機房操作日誌（試用版）
app.org=合作金庫資訊部
app.logicalDayCutoffHour=7
app.pollSeconds=5

# ---------- 認證：bypass = 不驗證密碼 ----------
# 改成 ldap 並填入 ldap.* / roles.* 即可接 AD（設定項同 app.properties.sample）
auth.mode=bypass
bypass.users=op001:OPERATOR:王小明,op002:OPERATOR:李大華,op003:OPERATOR:張三,dep001:DEPUTY:陳副科,chief001:CHIEF:林科長,admin:OPERATOR|DEPUTY|CHIEF:管理者
# 未列在 bypass.users 的任意帳號會得到這些角色
bypass.defaultRoles=OPERATOR|DEPUTY|CHIEF
# 填帳號則開啟頁面即自動登入（登出後 /login?select=1 可換帳號）；留空 = 顯示登入表單
bypass.autoLogin=

roles.adminAccounts=
roles.adminGroups=
security.allowedClientIps=
security.trustProxyHeader=false

# ---------- 資料庫：內嵌 H2（DB2 相容模式），檔案放在 /data（docker volume） ----------
db.url=jdbc:h2:file:/data/tcboplog;MODE=DB2
db.user=sa
db.password=
db.autoInit=true
db.seedDefaultsIfEmpty=true

# ---------- PDF 中文字型（image 內建文泉驛正黑 TrueType） ----------
pdf.fontPaths=/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc,0;/app/fonts/msjh.ttc,0;C:/Windows/Fonts/msjh.ttc,0
pdf.fontName=WenQuanYi Zen Hei
